name: Data Quality & Validation CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run nightly validation at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  validate-data-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Data Profiling & Great Expectations Validation
      run: |
        python run_pipeline.py

    - name: Upload Data Quality Reports
      uses: actions/upload-artifact@v4
      with:
        name: data-quality-reports
        path: |
          reports/data_profiling_and_quality_report.html
          reports/data_quality_executive_summary.md
          reports/dq_validation_results.json
          great_expectations/uncommitted/validations/
